experiences:
  title: Experiences
  info:
  - role: Senior Technical Program Manager
    time: Jan 2023 - Present
    company: Microsoft, Switzerland (Geneva)
    details: |

      Led cross-functional initiatives within the Contributor Experience group on the Microsoft Learn platform (millions of monthly users), building tools, services, and workflows that power global content creation, publishing, and governance. Work underpins AI-powered answer generation across flagship Microsoft products.

      - Spearheaded the launch of an AI-powered editorial review system for Azure documentation, reducing manual review time by 25% across 10,000+ annual PRs while improving consistency and contributor satisfaction.

      - Delivered a platform-wide Automated Publishing Service that eliminated 80% of manual publishing effort across 30+ GitHub repositories, driving automation and operational efficiency, accelerating release cycles from weekly/monthly to daily, and introducing BI dashboards for real-time publishing visibility and compliance.

      - Engineered an AI-driven feedback triage system (PowerApps) integrating translation, sentiment analysis, and profanity filtering; centralized 120,000+ annual entries (~8,000/day) and cut triage time from weeks to hours, enabling faster product and content improvements.

      - Unified globally distributed engineering teams (US, China, India, Europe) to deliver AI-driven editorial and publishing systems on schedule, strengthening stakeholder alignment and accelerating delivery despite timezone and cultural barriers.

  - role: Senior Content Developer
    time: Jul 2016 - Dec 2022
    company: Microsoft, Australia (Melbourne)
    details: |
      
      Drove technical initiatives on Microsoft Learn to unify content workflows, scale live training delivery, and enhance developer education for global audiences.

      - Pioneered Microsoft's Learn Live platform, the flagship channel for live instructor-led training on Learn content, reaching hundreds of thousands of developers and IT professionals worldwide. Designed production systems and presenter workflows that enabled high-quality delivery at scale, supported Tier 1 events such as Microsoft Build and Ignite, and ensured business continuity during COVID.

      - Consolidated 90+ content teams and migrated 20,000+ work items into a unified Azure DevOps system; developed custom migration tools that cut migration time from weeks to hours, and standardized planning and tracking processes to improve visibility, reporting accuracy, and compliance across the organization.

      - Standardized training assets, onboarding guides, and delivery practices, reducing content production time and enabling consistent, repeatable learning experiences across global presenter teams.

    skills: |
      - Training
      - Program Management
      - Xamarin Mobile Development
      - Azure developers
      - Live Streaming (OBS)
      - PowerApps

  - role: Senior Mobile Development Instructor
    time: Jan 2015 - Jun 2016
    company: Xamarin, Melbourne (Remote)
    details: |
      Xamarin University was a premier live online training platform for developers using Xamarin, a cross-platform mobile development framework (and precursor to .NET MAUI). The program delivered instructor-led training, certification preparation, and developer support to help learners build mobile apps using C#. Xamarin University played a key role in ecosystem growth and developer enablement leading up to Microsoft's acquisition of Xamarin in 2016.

      - As a Senior Mobile Development Instructor, I delivering live interactive training sessions on iOS, Android, and Windows Phone development using Xamarin and C#. Maintained an average instructor rating of 9.46 and NPS of 0.9, training thousands of developers worldwide.

      - Led 1-on-1 consulting sessions and office hours to reinforce course material and provide personalized guidance, improving learner success and app delivery outcomes.

      - Delivered live webinars and in-person workshops at major events including Xamarin Evolve, supporting developer onboarding and ecosystem growth.

      - Created technical content including sample apps, walkthroughs, and supporting material for certifications, helping scale training impact across the global community.

      - Wrote blog posts and participated in community engagement to promote best practices and boost adoption of the Xamarin platform. Maintained and grew the Weekly Xamarin newsletter to 4K+ subscribers, hosted Twitch livestreams (1K+ followers), and ran the Melbourne Xamarin Meetup to support community engagement.

  - role: Development Manager
    time: Jan 2007 - Mar 2015
    company: Fred IT Group, Melbourne
    details: |
      Fred IT Group is Australia'ss largest dedicated provider of pharmacy IT solutions, serving over 3,000 pharmacies with products like dispensing, point-of-sale, ePrescribing, and cloud-based management systems. In my role as Development Manager, I led a team delivering award-winning, cross-platform windows and mobile.

      - Technical lead for the award-winning eRx-Express mobile app, delivered with Xamarin across iOS, Android, Windows Phone, and WinRT; honored for its innovation and usability in the healthcare industry.

      - Led a team of six developers in building “FredNXT Office,” a Windows Store app integrated with Dynamics AX backend for ordering, invoicing, product catalogs, and POS services—significantly enhancing field operations.

      - Championed Agile transformation, coaching and upskilling the development team and broader organization, resulting in faster delivery cycles and improved cross-team collaboration.

      - Architected and delivered the Fred Office Pharmacy solution, a flagship retail pharmacy management system deeply integrated with Dynamics AX, setting a new standard in the industry.

  - role: Contract Xamarin Mobile Developer
    time: Aug 2014 - Dec 2014
    company: Xamling Consulting, Contract - Australia (Melbourne)
    details: |
        - Porting of the Project Tripod WP8 App to the Xamarin.Forms platform for iOS and Android
        - Project Tripod is a UI intensive timelapse photography app requiring heavy use of Custom Renderers and Cross Platform coding techniques.

  - role: Technical Lead / Coach 
    time: Sep 2004 - Jan 2007
    company: Liberty Financial, Melbourne
    details: |
      Liberty Financial is a leading non-bank lender in Australia and New Zealand, offering innovative, flexible home, car, personal, and business loans.

      - Mentored and coached the software development team, accelerating their adoption of Agile processes and advanced coding practices, which yielded measurable productivity gains and improved delivery quality.

      - Led full lifecycle development of multiple C# applications, driving architectural decisions and delivering production systems that supported critical business functions.

  - role: Product Consultant / Evangelist
    time: Feb 2002 - Sep 2004
    company: SecureNet, Melbourne
    details: |
      A specialist cybersecurity provider in the Asia-Pacific region, SecureNet offered enterprise-grade identity management, PKI, single sign-on (SSO), and certificate authority services — including major contracts like a PKI/Identrus system for ANZ Bank

      - Served as lead developer and technical consultant on large-scale identity management and PKI systems, driving the architecture and deployment of SSO, digital signing, smart-card certificate management, and delegated administration frameworks.

      - Led pre-sales and developer engagement, delivering technical demos, workshops, and training to help internal teams and clients integrate SecureNet's security framework into their applications.
  
      - Coached development teams on secure authentication implementations, accelerating their adoption of PKI and security best practices and enhancing overall solution robustness.

  - role: Senior Developer
    time: Mar 2000 - Feb 2002
    company: ANZ Bank, Melbourne
    details: |
      Spearheaded R&D initiatives in PKI and web security at ANZ Bank, one of Australia's largest banks, focusing on secure online banking and digital identity management.

      - Developed early architectures and prototypes that evolved into a full production system supporting secure bank transactions.

      - Contributed to the creation of IP that was later sold to a third-party company for commercialization, underscoring the project's innovation and strategic value.

      - Collaborated with stakeholders to translate cutting-edge security research into real-world banking applications, significantly enhancing the organization's digital security posture

  - role: Senior Developer (Contract)
    time: Apr 1998 - Jan 1999
    company: Greenwich Natwest Bank, London, UK
    details: |

      A major division of NatWest Bank, Greenwich Natwest focused on providing financial services to corporate and institutional clients, with a strong emphasis on technology-driven solutions.

      - Designed and developed full-stack banking systems, creating user interfaces in VB, business components via ActiveX DLLs, and backend database structures in SQL Server.

      - Delivered modular, scalable solutions supporting transaction processing and banking operations, contributing to improved system performance and maintainability.

  - role: Software Developer (Contract)
    time: Apr 1997 - Nov 1997
    company: Reuters / Citibank, London, UK
    details: |
      A global leader in financial information and analytics, and a major banking institution, respectively, collaborating on client-facing real-time data tools.

      - Designed and developed a real-time deal data interface, enabling clients to efficiently search, browse, and reconcile transactions.

      - Packaged the solution as a reusable component, later adopted across multiple internal applications, supporting enhanced data access and consistency.

  - role: Microsoft Certified Trainer
    time: Feb 1995 - Dec 1996
    company: ImageWord, Canberra
    details: |
      Technology training consultancy delivering Microsoft Official Curriculum (MOC) courses and technical workshops to local and international learners.

      - Delivered Microsoft Official Curriculum courses (Visual Basic, Access, Windows OS & Services Architecture) to both local and international audiences, ensuring high-quality technical instruction and learner outcomes.

      - Presented at Microsoft Tech-Ed '95, leading a session on advanced Word techniques and WordBasic development with ODBC integration, showcasing expertise and contributing to the professional development of attendees.

  - role: Developer
    time: Jan 1994 - Jan 1995
    company: Dept. Human Services and Health, Canberra
    details: |

      Federal agency responsible for delivering health, community, and social services to Australians.

      - Integrated legacy mainframe (NOMAD) personnel systems with front-end reporting tools, delivering management reports for departmental leadership.

      - Maintained and enhanced the production Home and Community Care (HACC) system, ensuring reliable operation and improving service delivery workflows.


