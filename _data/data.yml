  summary: |
    Senior technical leader and program manager with nearly a decade at Microsoft, delivering global AI, automation, and platform programs that expanded developer ecosystems and digital learning platforms for millions of users worldwide. Experienced in leading large-scale initiatives in technology, education, healthcare, and financial services, with expertise in program management, product strategy, and stakeholder alignment. With a foundation in software engineering, mobile development, agile practices, and team coaching,  I combine technical depth with clear communication to design scalable solutions, improve operational efficiency, and enable teams to excel.

